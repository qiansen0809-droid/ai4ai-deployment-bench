[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4ai-deployment-bench"
version = "0.1.0"
description = "Shared deployment benchmark contracts and evaluation tools"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["adapters*", "tasks*", "evaluation*", "instrumentation*", "baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
